name: Deploy web apps to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: country_test
          POSTGRES_PASSWORD: country_test_local
          POSTGRES_DB: country_user_flow
        ports:
          - 55439:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://country_test:country_test_local@127.0.0.1:55439/country_user_flow?schema=public
      TEST_DATABASE_URL: postgresql://country_test:country_test_local@127.0.0.1:55439/country_user_flow?schema=public
    defaults:
      run:
        working-directory: waimai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: waimai/backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run test:flow

  deploy:
    needs: validate-backend
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            waimai/admin-web/package-lock.json
            waimai/user-app/package-lock.json
            waimai/rider-app/package-lock.json

      - name: Install admin dependencies
        working-directory: waimai/admin-web
        run: npm ci

      - name: Build admin web
        working-directory: waimai/admin-web
        run: npm run build

      - name: Install user app dependencies
        working-directory: waimai/user-app
        run: npm ci

      - name: Build user app H5
        working-directory: waimai/user-app
        run: npm run type-check && npm run build:h5

      - name: Install rider app dependencies
        working-directory: waimai/rider-app
        run: npm ci

      - name: Build rider app H5
        working-directory: waimai/rider-app
        run: npm run type-check && npm run build:h5

      - name: Prepare Pages artifact
        run: |
          mkdir -p pages-dist/admin pages-dist/user pages-dist/rider
          cp -R waimai/user-app/dist/build/h5/. pages-dist/
          cp -R waimai/admin-web/dist/. pages-dist/admin/
          cp -R waimai/rider-app/dist/build/h5/. pages-dist/rider/
          cp .github/pages/user-redirect.html pages-dist/user/index.html
          touch pages-dist/.nojekyll
          echo "www.xiangzhen.site" > pages-dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
